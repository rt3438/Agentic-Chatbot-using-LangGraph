name: CI/CD - Streamlit Docker to EC2 via Docker Hub

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
  DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}

  IMAGE_NAME: agentic-chatbot
  CONTAINER_NAME: agentic-chatbot
  HOST_APP_DIR: /opt/agentic-chatbot
  CONTAINER_PORT: "8501"

jobs:
  test-build-deploy:
    name: Test, Build, Push, Deploy
    runs-on: ubuntu-latest
    environment: production

    steps:
      # 1. Checkout source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Validate required GitHub configuration
      - name: Validate required GitHub configuration
        shell: bash
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
        run: |
          missing=0

          check_var() {
            local name="$1"
            local value="$2"

            if [ -z "$value" ]; then
              echo "❌ Missing required configuration: $name"
              missing=1
            else
              echo "✅ $name is configured"
            fi
          }

          check_var "AWS_REGION" "$AWS_REGION"
          check_var "EC2_INSTANCE_ID" "$EC2_INSTANCE_ID"
          check_var "DOCKERHUB_USERNAME" "$DOCKERHUB_USERNAME"
          check_var "DOCKERHUB_TOKEN" "$DOCKERHUB_TOKEN"
          check_var "AWS_ROLE_ARN" "$AWS_ROLE_ARN"

          if [ "$missing" -ne 0 ]; then
            echo "One or more required GitHub variables/secrets are missing."
            exit 1
          fi

      # 3. Set up Python for CI validation
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # 4. Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 5. Validate main Python files
      - name: Validate Python files
        run: |
          python -m py_compile app.py
          python -m py_compile backend.py

      # 6. Run tests if present
      - name: Run tests if present
        shell: bash
        run: |
          if [ -d "tests" ]; then
            python -m pytest -q
          else
            echo "No tests/ directory found; skipping pytest."
          fi

      # 7. Test Docker Hub connectivity
      - name: Test Docker Hub connectivity
        shell: bash
        run: |
          echo "Testing Docker registry endpoint..."
          curl -I \
            --connect-timeout 10 \
            --max-time 20 \
            https://registry-1.docker.io/v2/ || true

          echo "Testing Docker authentication endpoint..."
          curl -I \
            --connect-timeout 10 \
            --max-time 20 \
            https://auth.docker.io/ || true

      # 8. Log in to Docker Hub with retry
      - name: Log in to Docker Hub
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          for attempt in 1 2 3; do
            echo "Docker Hub login attempt $attempt of 3..."

            if echo "$DOCKERHUB_TOKEN" | docker login \
              --username "$DOCKERHUB_USERNAME" \
              --password-stdin; then

              echo "✅ Docker Hub login successful"
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              echo "⚠️ Docker Hub login failed or timed out. Retrying in 20 seconds..."
              sleep 20
            fi
          done

          echo "❌ Docker Hub login failed after 3 attempts."
          exit 1

      # 9. Build and push Docker image
      - name: Build and push Docker image
        id: docker-image
        shell: bash
        run: |
          IMAGE_SHA="${DOCKERHUB_USERNAME}/${IMAGE_NAME}:${GITHUB_SHA}"
          IMAGE_LATEST="${DOCKERHUB_USERNAME}/${IMAGE_NAME}:latest"

          docker build \
            --tag "${IMAGE_SHA}" \
            --tag "${IMAGE_LATEST}" \
            .

          docker push "${IMAGE_SHA}"
          docker push "${IMAGE_LATEST}"

          echo "image_uri=${IMAGE_SHA}" >> "$GITHUB_OUTPUT"

      # 10. Authenticate GitHub Actions to AWS with OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # 11. Validate EC2 runtime configuration and deploy
      - name: Deploy Docker image to EC2
        id: deploy
        shell: bash
        env:
          IMAGE_URI: ${{ steps.docker-image.outputs.image_uri }}
        run: |
          cat > ssm-parameters.json <<EOF
          {
            "commands": [
              "set -e",
              "mkdir -p '${HOST_APP_DIR}/faiss_db'",
              "touch '${HOST_APP_DIR}/chatebot.db'",
              "ENV_FILE='${HOST_APP_DIR}/.env'",
              "test -f \"\$ENV_FILE\" || { echo '❌ Missing EC2 environment file: ${HOST_APP_DIR}/.env'; exit 1; }",
              "for VAR in OPENAI_API_KEY TAVILY_API_KEY OPENWEATHER_API_KEY LANGSMITH_API_KEY LANGSMITH_ENDPOINT ALPHA_VANTAGE_API_KEY; do grep -Eq \"^\${VAR}=.+\" \"\$ENV_FILE\" || { echo \"❌ Missing required EC2 environment variable: \${VAR}\"; exit 1; }; echo \"✅ \${VAR} is configured\"; done",
              "docker pull '${IMAGE_URI}'",
              "docker rm -f '${CONTAINER_NAME}' 2>/dev/null || true",
              "docker run -d --name '${CONTAINER_NAME}' --restart unless-stopped --env-file '${HOST_APP_DIR}/.env' -p '${CONTAINER_PORT}:8501' -v '${HOST_APP_DIR}/chatebot.db:/app/chatebot.db' -v '${HOST_APP_DIR}/faiss_db:/app/faiss_db' '${IMAGE_URI}'",
              "sleep 5",
              "docker ps --filter 'name=${CONTAINER_NAME}' --filter 'status=running' --format '{{.Names}}' | grep -qx '${CONTAINER_NAME}'",
              "docker image prune -f"
            ]
          }
          EOF

          COMMAND_ID=$(
            aws ssm send-command \
              --instance-ids "${EC2_INSTANCE_ID}" \
              --document-name "AWS-RunShellScript" \
              --comment "Deploy ${CONTAINER_NAME} commit ${GITHUB_SHA}" \
              --parameters file://ssm-parameters.json \
              --query "Command.CommandId" \
              --output text
          )

          echo "command_id=${COMMAND_ID}" >> "$GITHUB_OUTPUT"

          aws ssm wait command-executed \
            --command-id "${COMMAND_ID}" \
            --instance-id "${EC2_INSTANCE_ID}"

      # 12. Show deployment output
      - name: Show EC2 deployment result
        if: always() && steps.deploy.outputs.command_id != ''
        shell: bash
        run: |
          aws ssm get-command-invocation \
            --command-id "${{ steps.deploy.outputs.command_id }}" \
            --instance-id "${EC2_INSTANCE_ID}" \
            --query '{
              Status: Status,
              Output: StandardOutputContent,
              Error: StandardErrorContent
            }'
